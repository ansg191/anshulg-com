name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile --save-text-lockfile
      - name: Prettier Check
        run: bun run format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile --save-text-lockfile
      - name: Run Linter
        run: bun run lint
